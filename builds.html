<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>던전 크롤러 — 최고 조합</title>
<style>
  :root {
    --bg: #0d0e14;
    --panel: #16181f;
    --row: #1b1e27;
    --border: #2a2d3a;
    --text: #cdd3de;
    --muted: #8a91a0;
    --accent: #ffcf5c;
    --set: #2fd6b5;
    --unique: #ffb347;
    --rw: #ffd54f;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: "Courier New", ui-monospace, monospace; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  h1 { font-size: 20px; letter-spacing: 2px; margin: 0; color: var(--accent); text-shadow: 0 0 8px rgba(255, 207, 92, 0.3); }
  a.btn { color: var(--text); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; text-decoration: none; font-size: 13px; }
  @media (hover: hover) { a.btn:hover { border-color: var(--accent); color: var(--accent); } }
  .cond { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; color: var(--muted); margin-bottom: 12px; line-height: 1.6; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
  .tabs button { font: inherit; font-size: 13px; color: var(--muted); background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  .tabs button[aria-selected="true"] { color: var(--accent); border-color: var(--accent); }
  section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px; margin-bottom: 12px; min-width: 0; }
  section[hidden] { display: none; }
  h2 { font-size: 15px; margin: 0 0 6px; color: var(--accent); }
  h3 { font-size: 14px; margin: 14px 0 6px; }
  .sub { font-size: 12px; color: var(--muted); margin: 0 0 8px; line-height: 1.6; }
  .build { background: var(--row); border: 1px solid var(--border); border-radius: 8px; padding: 10px; margin-bottom: 8px; }
  .build.top { border-color: var(--accent); }
  .build-head { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px; align-items: baseline; }
  .build-head b { font-size: 14px; }
  .rank { color: var(--accent); margin-right: 6px; }
  .res { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .res b, .fl b { color: #7ee787; }
  .res b.bad, .fl b.bad { color: #ff7b72; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 8px; }
  th, td { text-align: left; padding: 5px 6px; border-top: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: normal; white-space: nowrap; width: 54px; }
  .set { color: var(--set); } .uq { color: var(--unique); } .rw { color: var(--rw); }
  .meta { color: var(--muted); }
  .stat { display: inline-block; margin-right: 4px; }
  .pieces { font-size: 12px; margin-top: 6px; line-height: 1.7; }
  ul { margin: 6px 0; padding-left: 18px; font-size: 13px; line-height: 1.7; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  footer { font-size: 12px; color: var(--muted); margin-top: 14px; line-height: 1.6; }
  @media (max-width: 560px) { main { padding: 12px; } th { width: 40px; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-t>🏆 최고 조합 (헬)</h1>
    <a class="btn" href="./" data-t>게임으로</a>
  </header>
  <div class="cond" id="cond"></div>
  <nav class="tabs" role="tablist">
    <button type="button" role="tab" data-tab="noUnique" aria-selected="true" data-t>1. 유니크 없이</button>
    <button type="button" role="tab" data-tab="withUnique" aria-selected="false" data-t>2. 유니크 포함</button>
    <button type="button" role="tab" data-tab="early" aria-selected="false" data-t>3. 헬 초반</button>
    <button type="button" role="tab" data-tab="farm" aria-selected="false" data-t>4. 파밍</button>
    <button type="button" role="tab" data-tab="unused" aria-selected="false" data-t>잘 안 쓰이는 아이템</button>
  </nav>
  <section id="noUnique"></section>
  <section id="withUnique" hidden></section>
  <section id="early" hidden></section>
  <section id="farm" hidden></section>
  <section id="unused" hidden></section>
  <footer data-t>
    시뮬레이션은 실제 게임 규칙(아이템·몬스터·전투)으로 계산했어요. 부위를 하나씩 바꿔 가며 더 좋아지는 쪽으로 찾고, 상위 조합은 500번씩 다시 확인했어요.
    턴이 같으면 오차(몇 턴) 안이라 순위가 바뀔 수 있어요. 폭풍전야는 맞는 몬스터 모두에게 걸려 있다고 봐서 실제보다 조금 좋게 나와요.
  </footer>
</main>
<script src="i18n.js"></script>
<script src="i18n/en.js"></script>
<script src="i18n/ja.js"></script>
<script src="i18n/en-ui.js"></script>
<script src="i18n/ja-ui.js"></script>
<script src="items.js"></script>
<script src="monsters.js"></script>
<script>RLI18N.apply(window.RLItems, window.RLMonsters); document.documentElement.lang = RLI18N.lang; RLI18N.translateDom(); document.title = RLI18N.t("던전 크롤러 — 최고 조합");</script>
<script src="builds.js"></script>
<script>
(() => {
  const I = RLItems, B = RLBuilds, M = RLMonsters, T = RLI18N.t;
  const el = (tag, props = {}, ...kids) => { const e = Object.assign(document.createElement(tag), props); for (const k of kids.flat(Infinity)) if (k != null) e.append(k); return e; };
  const ORDER = ["weapon", "offhand", "head", "chest", "arms", "pants", "boots"];
  const stat = (k) => I.STATS[k].name + (I.STATS[k].pct ? "%" : "");
  const res = (b) => el("span", { className: "res" }, T("몰려옴 "), el("b", {}, `${b.wave[0]}%`), T(" {0}턴 · 염라대왕 ", b.wave[1]), el("b", {}, `${b.boss[0]}%`), T(" {0}턴", b.boss[1]));
  const uqName = (k) => I.UNIQUE.items[k].name;
  const rwLabel = (n) => I.RUNEWORDS.find(w => w.name === n)?.label || n;   // 룬워드 이름(name)은 룬 조합의 키라서 화면엔 label
  const uqWhere = (k) => { const U = I.UNIQUE.items[k]; return T("헬 {0}층 {1}", U.boss, M.namedAt(U.boss)?.name || T("네임드")); };
  const BASE = { longsword: T("장검"), shield: T("방패"), chest: T("갑옷"), head: T("투구"), weapon: T("단검"), staff: T("지팡이") };
  // 슬롯 하나 → [이름(색), 설명]
  function cell(slot, s) {
    if (s.rw) {
      const w = I.RUNEWORDS.find(x => x.name === s.rw);
      return [el("span", { className: "rw" }, T("룬워드 {0}", rwLabel(s.rw))),
        el("div", { className: "meta" }, T("커먼 {0} (홈 {1}칸 이상)에 앞에서부터 {2} 룬", BASE[s.base] || s.base, w.runes.length, w.runes.map(r => I.RUNES[r].name).join(" → "))),
        el("div", { className: "meta" }, [...Object.entries(w.stats).map(([k, v]) => I.formatStat(k, v)), ...I.runewordSpecialText(w.special)].join(" · "))];
    }
    if (s.uq) {
      const U = I.UNIQUE.items[s.uq];
      return [el("span", { className: "uq" }, `✦ ${U.name}`), el("div", { className: "meta" }, T("{0} · 줄 고정 · {1}", uqWhere(s.uq), U.text))];
    }
    const lines = [];
    if (s.main) lines.push(el("div", {}, "★ ", s.main.map(stat).join(", ")));
    if (s.lines) lines.push(el("div", {}, "◆ ", s.lines.map(stat).join(", ")));
    if (s.set) return [el("span", { className: "set" }, I.SETS[s.set].pieces[slot]), ...lines];
    const nm = s.leg === "offhandDagger" ? T("레전더리 보조 단검") : s.leg === "shield" ? T("레전더리 방패") : T("레전더리 {0}", I.SLOT_NAMES[slot]);
    const rec = I.RECOMMEND.nightmare.slots[slot === "offhand" ? "offhand" : slot];
    return [el("span", {}, nm), ...(lines.length ? lines : rec ? [el("div", { className: "meta" }, T("◆ {0} (나이트메어 추천 줄)", rec.lines.map(stat).join(", ")))] : [])];
  }
  function buildCard(b, i, acc) {
    const head = el("div", { className: "build-head" }, el("b", {}, el("span", { className: "rank" }, T("{0}위", i + 1)), " ", b.name), res(b));
    const kids = [head];
    if (b.detail) {
      kids.push(el("table", {}, el("tbody", {},
        ...ORDER.filter(s => b.slots[s]).map(s => el("tr", {}, el("th", {}, I.SLOT_NAMES[s]), el("td", {}, ...cell(s, b.slots[s])))),
        el("tr", {}, el("th", {}, T("장신구")), el("td", {}, acc.text, el("div", {}, "◆ ", acc.lines.join(", ")))))));
      if (b.why) kids.push(el("div", { className: "note" }, T("왜: {0}", b.why)));
    } else {
      kids.push(el("div", { className: "pieces" }, ORDER.filter(s => b.slots[s]).map((s, j) => {
        const c = cell(s, b.slots[s])[0];
        return [j ? " · " : "", el("span", { className: "meta" }, `${I.SLOT_NAMES[s]} `), c];
      })));
    }
    if (b.note) kids.push(el("div", { className: "note" }, b.note));
    return el("div", { className: `build${i === 0 ? " top" : ""}` }, ...kids);
  }
  function renderSide(id) {
    const side = B[id];
    document.getElementById(id).replaceChildren(
      el("h2", {}, side.title),
      el("p", { className: "sub" }, T("장신구: {0}. 비교: {1} 몰려옴 {2}% · 염라대왕 {3}%", side.acc.text, side.compare.name, side.compare.wave[0], side.compare.boss[0])),
      ...side.builds.map((b, i) => buildCard(b, i, side.acc)),
      el("h3", {}, T("줄 고르기 (주 능력치 ★ · 추가 능력치 ◆)")),
      el("ul", {},
        el("li", {}, T("세트 조각: ★ 방어력·최대 HP (팔은 방어력·치명타 확률·공격력%, 바지는 방어력·최대 HP·방어력%). ◆ 치명타 확률·치명타 피해·공격력%에 + 최대 HP (장화는 방어력)")),
        el("li", {}, T("치명타 확률은 75%가 최대라, 장신구·유니크로 이미 75%면 그 자리는 최대 HP나 스킬 피해(불·얼음·번개 피해)가 나아요")),
        el("li", {}, T("흡혈은 20%가 최대 (장검 + 방패면 30%): 무기·보조무기 주 능력치로 채우고, 모자라면 투구에 흡혈 줄")),
        el("li", {}, T("스킬이 있는 조합(화염의 세트 파이어볼, 여우구슬 지팡이 프로스트 노바)은 그 속성 피해 줄이 좋아요 (한 아이템에 속성 피해 줄은 하나만)")),
        el("li", {}, T("장신구 저항 줄: 불·얼음·번개를 하나씩 나눠 맞추고 나머지는 모든 속성 저항 (헬은 내 저항이 장비 합에서 −70이라 145%를 모아야 75%)"))),
      el("p", { className: "sub" }, T("줄 고르기는 위 1위 조합에서 한 줄씩 바꿔 보며 찾았어요 (줄 품질 75~95%). 95%에서는 모든 조합이 0%라 차이가 거의 없고, 75%처럼 장비가 덜 좋을 때 위 줄이 더 잘 버텨요.")));
  }
  function renderUnused() {
    const U = B.unused;
    const sum = (t) => t[0] + t[1];
    const bestNo = sum([B.noUnique.builds[0].wave[1], B.noUnique.builds[0].boss[1]]), bestUq = sum([B.withUnique.builds[0].wave[1], B.withUnique.builds[0].boss[1]]);
    document.getElementById("unused").replaceChildren(
      el("h2", {}, T("잘 안 쓰이는 룬워드·유니크")),
      el("p", { className: "sub" }, T("그 아이템을 꼭 낄 때 가장 좋은 조합의 결과예요 (모두 쓰러지지는 않아서 걸린 턴으로 비교). 1위 조합: 유니크 없이 {0}턴, 유니크 포함 {1}턴 (몰려옴 + 염라대왕)", bestNo, bestUq)),
      el("h3", {}, T("룬워드 (상위 조합에 안 들어감)")),
      U.runewords.length ? null : el("p", { className: "sub" }, T("없어요: 모든 룬워드가 최고 조합·헬 초반·파밍 중 어딘가에서 쓰여요 (치유는 dc#53에서 없앴어요)")),
      el("table", {}, el("tbody", {}, ...U.runewords.map(r => { const w = I.RUNEWORDS.find(x => x.name === r.name);
        return el("tr", {}, el("th", {}, el("span", { className: "rw" }, rwLabel(r.name))), el("td", {}, T("{0}턴 (몰려옴 {1} · 염라대왕 {2}) · 같이: {3}", sum(r.turns), r.turns[0], r.turns[1], r.with), r.use ? el("div", {}, `→ ${r.use}`) : null, el("div", { className: "meta" }, `${w.bases.map(b => BASE[b] || b).join("·")} · ${[...Object.entries(w.stats).map(([k, v]) => I.formatStat(k, v)), ...I.runewordSpecialText(w.special)].join(" · ")}`))); }))),
      el("p", { className: "sub" }, T("상위 조합에 들어가는 룬워드: 필살일격 · 폭풍전야 · 도원결의 · 마음가짐 · 태산. 나무·송곳니는 3. 헬 초반, 기억·몰래·선견지명·카리스마·도원결의·쇠이빨 목걸이·여의 반지는 4. 파밍(아이템 발견)에서 써요")),
      el("h3", {}, T("유니크 (상위 조합에 안 들어감)")),
      el("table", {}, el("tbody", {}, ...U.uniques.map(r => el("tr", {}, el("th", {}, el("span", { className: "uq" }, uqName(r.uq))), el("td", {}, T("{0}턴 (몰려옴 {1} · 염라대왕 {2}) · 같이: {3}", sum(r.turns), r.turns[0], r.turns[1], r.with), el("div", { className: "meta" }, `${uqWhere(r.uq)} · ${I.UNIQUE.items[r.uq].text}`)))),
        ...U.accUniques.map(r => el("tr", {}, el("th", {}, el("span", { className: "uq" }, uqName(r.uq))), el("td", {}, r.text, el("div", { className: "meta" }, `${uqWhere(r.uq)} · ${I.UNIQUE.items[r.uq].text}`)))))),
      el("p", { className: "sub" }, T("방어구 유니크(구미호의 비녀·쇠비늘 갑옷·염라의 관복·용비늘 장화)는 유니크 7부위로 모을 때만 상위권 (3위, 25턴)이에요. 하나씩 끼면 세트가 더 좋아요")));
  }
  // 헬 초반: 층마다 [쓰러질 확률, 턴]
  const pctB = (v) => el("b", { className: v >= 10 ? "bad" : "" }, `${v}%`);
  function renderEarly() {
    const E = B.early;
    let rank = 0;
    document.getElementById("early").replaceChildren(
      el("h2", {}, E.title),
      el("p", { className: "sub" }, T("헬에 처음 들어가서 30층까지, 무기·보조무기를 뭘 낄까요? 다른 부위는 그 층 레전더리 그대로 두고 무기·보조무기만 바꿔서 쓰러질 확률과 걸린 턴을 쟀어요.")),
      ...E.builds.map((b) => {
        const top = !b.cmp && rank === 0, head = el("div", { className: "build-head" }, el("b", {}, b.cmp ? null : el("span", { className: "rank" }, T("{0}위", ++rank)), b.cmp ? "" : " ", b.name));
        const kids = [head, el("table", {}, el("tbody", {}, ...E.floors.map((f, j) => el("tr", {}, el("th", {}, T("{0}층", f)),
          el("td", { className: "fl" }, T("몰려옴 "), pctB(b.wave[j][0]), T(" {0}턴 · {1} ", b.wave[j][1], M.namedAt(f)?.name || T("보스")), pctB(b.boss[j][0]), T(" {0}턴", b.boss[j][1]))))))];
        if (b.slots) kids.push(el("div", { className: "pieces" }, ["weapon", "offhand"].map((sl, j) => [j ? " · " : "", el("span", { className: "meta" }, `${I.SLOT_NAMES[sl]} `), cell(sl, b.slots[sl])[0]])));
        if (b.why) kids.push(el("div", { className: "note" }, T("왜: {0}", b.why)));
        if (b.note) kids.push(el("div", { className: "note" }, b.note));
        return el("div", { className: `build${top ? " top" : ""}` }, ...kids);
      }));
  }
  // 파밍: 아이템 발견 % (초반: 룬워드 4개, 후반: 유니크 장신구)
  const mfOf = (s) => (s.rw ? I.RUNEWORDS.find(w => w.name === s.rw).stats.mf : I.UNIQUE.items[s.uq].stats.mf) || 0;
  const floorRows = (floors, b, named) => el("table", {}, el("tbody", {}, ...floors.map((f, j) => el("tr", {}, el("th", {}, T("{0}층", f)),
    el("td", { className: "fl" }, T("몰려옴 "), pctB(b.wave[j][0]), T(" {0}턴", b.wave[j][1]), ...(b.boss ? [T(" · 보스({0}층) ", f - 5), pctB(b.boss[j][0]), T(" {0}턴", b.boss[j][1])] : []),
      ...(named ? [` · ${M.namedAt(f)?.name || T("네임드")} `, pctB(named[j])] : []))))));
  function renderFarm() {
    const F = B.farm, e0 = F.econ[0];
    const items = [...I.RUNEWORDS.filter(w => w.stats.mf).map(w => [el("span", { className: "rw" }, w.label), T(" 룬워드 ({0}) +{1}%", w.bases.map(b => BASE[b] || b).join("·"), w.stats.mf)]),
      ...Object.values(I.UNIQUE.items).filter(U => U.stats?.mf).map(U => [el("span", { className: "uq" }, U.name), T(" 유니크{0} (헬 {1}층) +{2}%{3}", U.acc ? T(" 장신구") : "", U.boss, U.stats.mf, U.acc && U.slot === "ring" ? T(" (두 개면 두 배)") : "")])];
    const card = (b, i) => {
      const total = Math.min(I.FIND.max, b.slots.reduce((a, s) => a + mfOf(s), 0));
      const kids = [el("div", { className: "build-head" }, el("b", {}, b.name), el("span", { className: "res" }, T("아이템 발견 {0}%", total))),
        el("div", { className: "note" }, b.when),
        el("table", {}, el("tbody", {}, ...b.slots.map(s => el("tr", {}, el("th", {}, I.SLOT_NAMES[s.slot]), el("td", {}, ...cell(s.slot, s), el("div", {}, T("🔍 아이템 발견 +{0}%", mfOf(s)))))),
          el("tr", {}, el("th", {}, T("나머지")), el("td", {}, b.rest))))];
      if (b.wave) kids.push(el("h3", {}, T("헬 초반 (그 층 레전더리 품질 85% +10)")), floorRows(F.floors, b, b.named));
      if (b.alt) kids.push(el("div", { className: "note" }, T("{0}: 몰려옴 {1} — {2}", b.alt.name, b.alt.wave.map(x => T("{0}% {1}턴", x[0], x[1])).join(" · "), b.alt.text)));
      if (b.note) kids.push(el("div", { className: "note" }, b.note));
      return el("div", { className: `build${i === 0 ? " top" : ""}` }, ...kids);
    };
    document.getElementById("farm").replaceChildren(
      el("h2", {}, F.title),
      el("p", { className: "sub" }, T("아이템 발견 %: 처치할 때마다 {0}% × 발견% 확률로 보너스 아이템 하나 (레어 이상), 네임드 유니크·유니크 장신구 확률 × (1 + 발견% / {1}). 최대 {2}%", Math.round(I.FIND.bonus * 100), I.FIND.uniqueDiv, I.FIND.max)),
      ...F.builds.map(card),
      el("div", { className: "build" }, el("div", { className: "build-head" }, el("b", {}, T("{0} (비교)", F.compare.name))), floorRows(F.floors, F.compare)),
      el("h3", {}, T("얼마나 더 나올까 (헬 30층 몬스터 처치 1번)")),
      el("table", {}, el("tbody", {}, ...F.econ.map(r => el("tr", {}, el("th", {}, `${r.mf}%`),
        el("td", {}, T("레전더리+세트 {0}% (×{1}) · 판매 골드 {2} · 원하는 유니크 하나에 네임드 평균 {3}번", r.ls, (r.ls / e0.ls).toFixed(2), r.gold, r.uq)))))),
      el("p", { className: "note" }, F.note),
      el("h3", {}, T("아이템 발견이 붙는 아이템")),
      el("ul", {}, ...items.map(k => el("li", {}, ...k))));
  }
  const COND = { early: B.early.cond, farm: T("헬 10·20·30층 그 층 레전더리 품질 85% +10 + 레전더리 장신구 +10 · 몰려오는 20마리(8마리씩) / 보스 1:1 · 아이템 수입은 헬 30층 처치 1번의 기댓값 (실제 드롭 규칙으로 3만 번)") };
  const condOf = (id) => T("조건: {0}.{1}", COND[id] || B.cond, id === "farm" ? "" : T(" 쓰러질 확률이 같으면 더 빨리 끝내는 조합이 위예요."));
  document.getElementById("cond").textContent = condOf("noUnique");
  renderSide("noUnique"); renderSide("withUnique"); renderEarly(); renderFarm(); renderUnused();
  const show = (id) => { for (const b of document.querySelectorAll(".tabs button")) b.setAttribute("aria-selected", String(b.dataset.tab === id)); for (const s of document.querySelectorAll("main > section")) s.hidden = s.id !== id; document.getElementById("cond").textContent = condOf(id); };
  for (const b of document.querySelectorAll(".tabs button")) b.addEventListener("click", () => { show(b.dataset.tab); history.replaceState(null, "", `#${b.dataset.tab}`); });
  const fromHash = () => { if (["noUnique", "withUnique", "early", "farm", "unused"].includes(location.hash.slice(1))) show(location.hash.slice(1)); };
  fromHash(); addEventListener("hashchange", fromHash);
})();
</script>
