<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>던전 크롤러 — 상점</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<link rel="stylesheet" href="vendor/pay-station-sdk/style.css">
<style>
  :root {
    --bg: #0d0e14;
    --panel: #16181f;
    --row: #1b1e27;
    --border: #2a2d3a;
    --text: #cdd3de;
    --muted: #8a91a0;
    --accent: #ffcf5c;
    --cash: #2fd6b5;
    --bad: #ff6b6b;
    --good: #6bd36b;
    --font: "Courier New", ui-monospace, monospace;

    /* Headless Checkout 컴포넌트를 게임 색으로 */
    --psdk-font-family: var(--font);
    --psdk-font-color: var(--text);
    --psdk-secondary-color: var(--muted);
    --psdk-neutral-color: var(--text);
    --psdk-neutral-bg: var(--row);
    --psdk-bg-secondary: var(--panel);
    --psdk-common-border-radius: 6px;
    --psdk-divider-color: var(--border);
    --psdk-input-bg: var(--bg);
    --psdk-input-default-border-color: var(--border);
    --psdk-input-hover-border-color: var(--muted);
    --psdk-input-focus-border-color: var(--accent);
    --psdk-input-error-border-color: var(--bad);
    --psdk-input-placeholder-color: #5d6474;
    --psdk-input-placeholder-focus-color: var(--muted);
    --psdk-input-disabled-bg: #1f222b;
    --psdk-button-default-bg: var(--accent);
    --psdk-button-hover-bg: #ffd97a;
    --psdk-button-press-bg: #e9b941;
    --psdk-button-color: #1a1406;
    --psdk-button-disabled-bg: #3a3d48;
    --psdk-button-disabled-color: #7c8190;
    --psdk-checkbox-checked-bg: var(--accent);
    --psdk-checkbox-unchecked-bg: #2a2d3a;
    --psdk-loader-color: var(--accent);
    --psdk-select-focus-bg: var(--accent);
    --psdk-select-focus-color: #1a1406;
    --psdk-select-hover-bg: #2a2d3a;
    --psdk-alert-bg: #3a1a20;
    --psdk-alert-color: #ffb3b3;
    --psdk-success-bg: #12301f;
    --psdk-success-color: #8ff0b0;
    --psdk-warning-bg: #3a2a12;
    --psdk-warning-color: #ffd28a;
    --psdk-methods-border-color: var(--border);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  a { color: var(--accent); }
  button, a.btn, select {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--border); border-radius: 6px; padding: 6px 12px; cursor: pointer;
  }
  a.btn { text-decoration: none; display: inline-block; }
  @media (hover: hover) { button:hover:not(:disabled), a.btn:hover { border-color: var(--accent); color: var(--accent); } }
  button:disabled { opacity: 0.45; cursor: default; }
  button.primary, a.btn.primary { background: var(--accent); border-color: var(--accent); color: #1a1406; font-weight: bold; }
  @media (hover: hover) { button.primary:hover:not(:disabled), a.btn.primary:hover { color: #1a1406; filter: brightness(1.08); } }

  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  h1 { font-size: 20px; letter-spacing: 2px; margin: 0; color: var(--accent); text-shadow: 0 0 8px rgba(255, 207, 92, 0.3); }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 13px; }
  #who { color: var(--muted); }
  .cash { color: var(--cash); font-weight: bold; }
  .cash::before { content: "◆ "; }
  #balance { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; }

  .notice { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 12px; line-height: 1.6; }
  .notice.sandbox { border-color: #6b5a24; background: #221d0e; color: #ffe2a1; }
  .notice.login { border-color: var(--accent); }
  .notice b { color: var(--accent); }

  section { margin-bottom: 18px; }
  h2 { font-size: 16px; margin: 0 0 4px; color: var(--accent); }
  .sub { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  @media (max-width: 520px) {
    .grid { grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { padding: 10px; }
    .card button { padding: 9px 4px; font-size: 13px; }
    .bonus { position: static; align-self: center; }
  }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; position: relative; }
  .art { font-size: 30px; line-height: 1; text-align: center; padding: 10px 0 4px; letter-spacing: 2px; }
  .art.cash-art { color: var(--cash); text-shadow: 0 0 10px rgba(47, 214, 181, 0.4); }
  .art.box-art { color: var(--accent); text-shadow: 0 0 10px rgba(255, 207, 92, 0.35); }
  .name { font-weight: bold; text-align: center; }
  .desc { font-size: 12px; color: var(--muted); text-align: center; min-height: 2.6em; }
  .bonus { position: absolute; top: 8px; right: 8px; background: #3a1a20; color: #ffb3b3; border: 1px solid #ff6b6b; border-radius: 4px; font-size: 11px; padding: 2px 6px; font-weight: bold; }
  .card.offer { border-color: #e0b44c; box-shadow: 0 0 12px rgba(224, 180, 76, 0.25); }
  .card.offer .bonus { background: #3a2e10; color: #ffe08a; border-color: #e0b44c; }
  .card button { width: 100%; padding: 10px; }
  .total { font-size: 12px; color: var(--cash); text-align: center; }
  .skeleton { height: 190px; background: linear-gradient(90deg, var(--panel), var(--row), var(--panel)); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 8px; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  .rates { display: flex; flex-wrap: wrap; gap: 6px; font-size: 12px; margin-top: 8px; }
  .rates span { background: var(--row); border: 1px solid var(--border); border-radius: 4px; padding: 3px 8px; }
  /* 확률 정보 (dc#107): 장비 상자 1회 기준 등급·고대 확률, 부위, 여러 번 상자 */
  .odds { margin-top: 12px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--row); font-size: 12.5px; line-height: 1.6; }
  .odds h3 { margin: 0 0 6px; font-size: 14px; }
  .odds table { border-collapse: collapse; margin: 4px 0 8px; min-width: 260px; }
  .odds th, .odds td { border-bottom: 1px solid var(--border); padding: 3px 10px 3px 0; text-align: left; }
  .odds td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .odds ul { margin: 0; padding-left: 18px; }
  footer { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 10px; }
  /* 이벤트 (dc#130): 주황·보라 칸 */
  #event-sec h2 { color: #ff9a3a; text-shadow: 0 0 8px rgba(255, 140, 40, 0.35); }
  .card.event { border-color: #a0522d; background: linear-gradient(160deg, #241426, var(--panel) 70%); }
  .art.event-art { color: #ff9a3a; text-shadow: 0 0 12px rgba(255, 140, 40, 0.5); }
  .skin-art { width: 64px; height: 64px; margin: 6px auto 0; background-image: url(img/sprites.png); background-repeat: no-repeat; image-rendering: pixelated; }
  .ev-have { font-size: 12px; text-align: center; color: #ffcf7a; }
  .ev-cash-row { display: flex; gap: 6px; }
  .ev-cash-row input { width: 64px; flex: none; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 6px; text-align: center; }
  .ev-cash-row button { flex: 1; }

  /* ---- 모달 ---- */
  .overlay { position: fixed; inset: 0; background: rgba(5, 6, 10, 0.78); display: flex; align-items: flex-start; justify-content: center; padding: 24px 12px; overflow-y: auto; z-index: 10; }
  .overlay[hidden] { display: none; }
  .modal { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; width: 100%; max-width: 460px; padding: 16px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); }
  .modal-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
  .modal-head h3 { margin: 0; font-size: 16px; color: var(--accent); }
  .modal-head button { padding: 4px 10px; }
  .summary { display: flex; justify-content: space-between; align-items: center; gap: 8px; background: var(--row); border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; font-size: 14px; }
  .summary .what { font-weight: bold; }
  .step-title { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
  .loader { text-align: center; color: var(--muted); padding: 24px 0; font-size: 13px; }
  .loader::before { content: "◆"; display: inline-block; margin-right: 6px; color: var(--accent); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .msg { font-size: 13px; padding: 8px 10px; border-radius: 6px; margin: 8px 0; }
  .msg.bad { background: #3a1a20; color: #ffb3b3; }
  .msg.good { background: #12301f; color: #8ff0b0; }
  .msg.info { background: var(--row); color: var(--text); }

  .methods { display: flex; flex-direction: column; gap: 6px; }
  .method { display: flex; align-items: center; gap: 10px; width: 100%; text-align: left; padding: 10px 12px; background: var(--row); }
  .method img { width: 40px; height: 26px; object-fit: contain; background: #fff; border-radius: 4px; padding: 2px; }
  .method-search { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; margin-bottom: 8px; }
  .method-search:focus { outline: none; border-color: var(--accent); }
  .more-methods { width: 100%; margin-top: 8px; color: var(--muted); }
  psdk-submit-button psdk-default-submit-button button { max-width: none; height: 44px; font-weight: bold; font-size: 15px; }

  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; }
  .fields > * { grid-column: span 2; min-width: 0; }
  .fields > .half { grid-column: span 1; }
  .form-area[hidden] { display: none; }
  .actions-row { display: flex; gap: 8px; margin-top: 12px; }
  .actions-row > * { flex: 1; }
  psdk-submit-button { display: block; margin-top: 12px; }
  psdk-legal { display: block; margin-top: 14px; font-size: 11px; }
  psdk-total { display: block; }
  psdk-payment-form-messages { display: block; margin-top: 8px; }

  .reveal { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow-y: auto; }
  .reveal div { background: var(--row); border-radius: 6px; padding: 8px 10px; font-size: 13px; display: flex; justify-content: space-between; gap: 8px; opacity: 0; transform: translateY(4px); animation: pop 0.25s forwards; }
  .reveal small { color: var(--muted); }
  @keyframes pop { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal div { animation: none; opacity: 1; transform: none; } .skeleton, .loader::before { animation: none; } }
</style>
</head>
<body>
<main>
  <header>
    <h1 data-i18n="title"></h1>
    <div class="bar">
      <span id="who"></span>
      <span id="balance" hidden><span class="cash" id="balance-value">0</span></span>
      <select id="lang" aria-label="Language">
        <option value="ko">한국어</option>
        <option value="en">English</option>
        <option value="ja">日本語</option>
      </select>
      <a class="btn" href="./" data-i18n="back"></a>
    </div>
  </header>

  <div id="sandbox-note" class="notice sandbox" hidden></div>
  <div id="login-note" class="notice login" hidden></div>
  <div id="page-msg" hidden></div>

  <section id="event-sec" hidden>
    <h2 id="event-title"></h2>
    <p class="sub" id="event-sub"></p>
    <div id="event-msg" hidden></div>
    <div class="grid" id="event-cards"></div>
  </section>

  <section id="offers-sec" hidden>
    <h2 data-i18n="offerTitle"></h2>
    <p class="sub" data-i18n="offerSub"></p>
    <div class="grid" id="offers"></div>
  </section>

  <section>
    <h2 data-i18n="cashTitle"></h2>
    <p class="sub" data-i18n="cashSub"></p>
    <div class="grid" id="packs"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
  </section>

  <section>
    <h2 data-i18n="boxTitle"></h2>
    <p class="sub" data-i18n="boxSub"></p>
    <div class="grid" id="boxes"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>
    <div class="rates" id="rates"></div>
    <div class="odds" id="odds"></div>
  </section>

  <footer data-i18n="footer"></footer>
  <footer><a href="privacy.html" style="color: inherit">개인정보처리방침 · Privacy</a></footer>
</main>

<!-- 결제 창 (Headless Checkout) -->
<div class="overlay" id="pay-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="pay-title">
    <div class="modal-head">
      <h3 id="pay-title" data-i18n="payTitle"></h3>
      <button type="button" id="pay-close" data-i18n="close"></button>
    </div>
    <div class="summary"><span class="what" id="pay-what"></span><psdk-total></psdk-total></div>
    <div id="pay-msg"></div>
    <div id="pay-methods"></div>
    <div id="pay-form" class="form-area" hidden>
      <div class="step-title" id="pay-method-name"></div>
      <div class="fields" id="pay-fields"></div>
      <psdk-payment-form-messages></psdk-payment-form-messages>
      <div id="pay-submit"></div>
      <div class="actions-row"><button type="button" id="pay-back" data-i18n="otherMethod"></button></div>
    </div>
    <div id="pay-extra"></div>
    <div id="pay-status"></div>
    <psdk-legal></psdk-legal>
  </div>
</div>

<!-- 상자 열기 -->
<div class="overlay" id="box-modal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="box-title">
    <div class="modal-head">
      <h3 id="box-title"></h3>
      <button type="button" id="box-close" data-i18n="close"></button>
    </div>
    <div id="box-msg"></div>
    <div class="reveal" id="box-items"></div>
    <div class="actions-row"><a class="btn primary" href="./" data-i18n="toGame"></a></div>
  </div>
</div>

<script src="items.js"></script>
<script src="sprites.js"></script>
<script src="events.js"></script>
<script src="ranking-config.js"></script>
<script src="vendor/pay-station-sdk/main.js"></script>
<script>
(() => {
  "use strict";

  // ---- 설정 ----
  // sandbox: true면 테스트 결제(실제 청구 없음, 테스트 카드), false면 실제 결제.
  // 테스트 결제로 되돌릴 때는 여기만 true로 바꾸면 됨 (주문 생성과 결제창이 함께 바뀜)
  const SHOP = {
    projectId: 317991,
    sandbox: true,
    cashSku: "cash",
    packGroup: "cash_packs",
    boxGroup: "equipment_boxes",
    offerGroup: "limited_offers",   // 현금 1회 한정 (고대 유니크 선택 상자)
  };
  const STORE_API = `https://store.xsolla.com/api/v2/project/${SHOP.projectId}`;
  const LOGIN_API = "https://login.xsolla.com/api";
  const LOGIN_CLIENT_ID = "18732";  // 게임(index.html)의 XSOLLA.clientId와 같음

  // ---- 문구 ----
  const T = {

  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const readJson = (k, fallback) => { try { return JSON.parse(store.get(k)) ?? fallback; } catch { return fallback; } };
  const $ = (id) => document.getElementById(id);
  function el(tag, { dataset, ...props } = {}, ...children) {
    const e = Object.assign(document.createElement(tag), props);
    if (dataset) Object.assign(e.dataset, dataset);
    for (const c of children) if (c != null) e.append(c);
    return e;
  }

  let lang = (() => {
    const saved = store.get("rl_lang");
    if (T[saved]) return saved;
    const nav = (navigator.language || "ko").slice(0, 2);
    return T[nav] ? nav : "ko";
  })();
  const t = (key, ...args) => { const v = T[lang][key]; return typeof v === "function" ? v(...args) : v; };

  // ---- 계정: 게임과 같은 주소라 게임이 저장한 로그인 정보를 함께 씀 ----
  const Auth = {
    data: readJson("rl_auth", null),
    loggedIn() { return !!this.data?.access; },
    claims() {
      try {
        const b64 = this.data.access.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        return JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(b64), c => c.charCodeAt(0))));
      } catch { return null; }
    },
    // 만료 1분 전이면 갱신 (게임의 Account.token과 같은 규칙)
    async token() {
      if (!this.data) return null;
      if (Date.now() < this.data.exp - 60000) return this.data.access;
      if (!this.data.refresh) return null;
      const res = await fetch(`${LOGIN_API}/oauth2/token`, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ grant_type: "refresh_token", client_id: LOGIN_CLIENT_ID, refresh_token: this.data.refresh }),
      });
      if (!res.ok) {
        if (res.status >= 400 && res.status < 500) { this.data = null; store.del("rl_auth"); }
        return null;
      }
      const d = await res.json();
      this.data = { access: d.access_token, refresh: d.refresh_token || this.data.refresh, exp: Date.now() + (d.expires_in || 3600) * 1000 };
      store.set("rl_auth", JSON.stringify(this.data));
      return this.data.access;
    },
    owner() { return `u:${this.claims()?.sub || "unknown"}`; },
  };

    constructor(status, code, message) { super(message); this.status = status; this.code = code; }
  }
  async function api(path, { method = "GET", body, auth = false } = {}) {
    const headers = {};
    if (body !== undefined) headers["Content-Type"] = "application/json";
    if (auth) {
      const tok = await Auth.token();
      if (!tok) throw new ApiError(401, 0, t("errAuth"));
      headers.Authorization = `Bearer ${tok}`;
    }
    const res = await fetch(STORE_API + path, { method, headers, body: body === undefined ? undefined : JSON.stringify(body) });
    const text = await res.text();
    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch {}
    if (!res.ok) throw new ApiError(res.status, data?.errorCode, data?.errorMessage || `HTTP ${res.status}`);
    return data;
  }
  const friendly = (e) => e.status === 401 ? t("errAuth") : e.code === 5006 ? t("errCash") : t("errGeneric", e.message);

  // ---- 화면: 문구, 계정, 잔액 ----
  function applyText() {
    document.documentElement.lang = lang;
    $("lang").value = lang;
    for (const node of document.querySelectorAll("[data-i18n]")) {
      const v = t(node.dataset.i18n);
      if (node.dataset.i18n === "footer") node.innerHTML = v; else node.textContent = v;
    }
    const sb = $("sandbox-note");
    sb.hidden = !SHOP.sandbox;
    sb.innerHTML = t("sandbox");
    const ln = $("login-note");
    ln.hidden = Auth.loggedIn();
    ln.replaceChildren();
    if (!Auth.loggedIn()) {
      const p = el("div"); p.innerHTML = t("loginNote");
      ln.append(p, el("a", { className: "btn primary", href: "./?login=shop", textContent: t("loginBtn"), style: "margin-top:8px" }));
    }
    const c = Auth.loggedIn() ? Auth.claims() : null;
    $("who").textContent = c ? t("who", c.email || c.phone_number || c.sub.slice(0, 8)) : t("guest");
    renderRates();
  }

  let balance = null;
  async function refreshBalance() {
    if (!Auth.loggedIn()) { balance = null; $("balance").hidden = true; return; }
    try {
      const d = await api("/user/virtual_currency_balance", { auth: true });
      balance = Number(d.items?.find(i => i.sku === SHOP.cashSku)?.amount || 0);
      $("balance").hidden = false;
      $("balance-value").textContent = balance.toLocaleString(lang);
    } catch (e) {
      if (e.status === 401) { applyText(); }
    }
    renderBoxes();
  }

  function showPageMsg(text, cls = "info") {
    const box = $("page-msg");
    box.hidden = !text;
    box.className = text ? `notice msg ${cls}` : "";
    box.textContent = text || "";
  }

  // ---- 이벤트 (dc#130): 하루 한 번 무료 재화 → 10개로 스킨 교환 · 남은 재화는 캐시 1:1 (게임 서버 event.php, 로그인 계정만) ----
  // 게스트는 이벤트 안내와 "로그인하고 받기"만 (재화·스킨·캐시가 계정에 걸려 있어서)
  const EV = window.RLEvents, SP = window.RLSprites;
  let ev = null, evBusy = false;
  const evText = (o) => (EV ? EV.text(o, lang) : "");
  const evDay = (d) => new Date(d + "T00:00:00Z").toLocaleDateString(lang, { month: "short", day: "numeric", timeZone: "UTC" });
  async function evCall(route, body) {
    const tok = await Auth.token();
    if (!tok) throw new ApiError(401, "login_required", t("errAuth"));
    const res = await fetch(`${window.RANKING_API}?r=${route}`, { method: body ? "POST" : "GET",
      headers: { Authorization: `Bearer ${tok}`, ...(body ? { "Content-Type": "application/json" } : {}) }, body: body ? JSON.stringify(body) : undefined });
    let d = null;
    try { d = await res.json(); } catch {}
    if (!res.ok) throw new ApiError(res.status, d?.error, t("evErr")[d?.error] || t("errGeneric", `HTTP ${res.status}`));
    return d;
  }
  async function loadEvent() {
    if (!EV || !window.RANKING_API) { ev = null; renderEvent(); return; }
    if (Auth.loggedIn()) { try { ev = await evCall("event_status"); } catch { ev = null; } }
    else {
      const e = EV.active();
      ev = e && { login: false, day: EV.today(), price: EV.SKIN_PRICE, skins: [], balance: 0, claimed: false,
        event: { id: e.id, theme: e.theme, start: e.start, end: e.end, exchangeUntil: EV.addDays(e.end, EV.EXCHANGE_DAYS), open: true, today: EV.dailyAmount(e), skins: EV.THEMES[e.theme].skins } };
    }
    renderEvent();
  }
  function evMsg(text, cls = "info") {
    const box = $("event-msg");
    box.hidden = !text; box.className = text ? `msg ${cls}` : ""; box.textContent = text || "";
  }
  function renderEvent() {
    const sec = $("event-sec"), e = ev?.event, def = e && EV.byId(e.id);
    sec.hidden = !def;
    if (!def) return;
    const coin = evText(EV.THEMES[e.theme]?.coin), login = !!ev.login;
    $("event-title").textContent = t("evTitle", evText(def.name));
    $("event-sub").textContent = t("evSub", evDay(e.start), evDay(e.end), evDay(e.exchangeUntil), coin);
    const toLogin = () => (location.href = "./?login=shop");
    const have = el("div", { className: "ev-have", textContent: t("evHave", coin, ev.balance || 0) });
    // 오늘의 무료 재화
    const dayName = def.days?.[ev.day]?.name;
    const claim = el("button", { type: "button", className: "primary" });
    if (!login) { claim.textContent = t("evLogin"); claim.onclick = toLogin; }
    else if (!e.open) { claim.textContent = t("evClosed"); claim.disabled = true; claim.className = ""; }
    else if (ev.claimed) { claim.textContent = t("evClaimed"); claim.disabled = true; claim.className = ""; }
    else { claim.textContent = t("evClaim"); claim.onclick = () => evAct("event_claim", {}, (r) => t("evGot", coin, r.got)); }
    const cards = [el("div", { className: "card event" },
      el("div", { className: "art event-art", textContent: "🎃" }),
      el("div", { className: "name", textContent: t("evDaily", coin) }),
      el("div", { className: "desc", textContent: e.open && dayName ? t("evDayBonus", evText(dayName), e.today) : t("evDailyDesc", EV.DAILY) }),
      have, claim)];
    // 스킨 (재화 10개)
    for (const id of e.skins) {
      const S = EV.SKINS[id], c = SP?.map[S.sprite], owned = (ev.skins || []).includes(id), price = ev.price || EV.SKIN_PRICE;
      const art = el("div", { className: "skin-art" });
      if (c) { art.style.backgroundSize = `${SP.cols * 64}px ${SP.rows * 64}px`; art.style.backgroundPosition = `-${c[0] * 64}px -${c[1] * 64}px`; }
      const b = el("button", { type: "button", className: "primary", dataset: { skin: id } });
      if (!login) { b.textContent = t("evLogin"); b.onclick = toLogin; }
      else if (owned) { b.textContent = t("evOwned"); b.disabled = true; b.className = ""; }
      else if ((ev.balance || 0) < price) { b.textContent = t("evShort", ev.balance || 0, price); b.disabled = true; b.className = ""; }
      else { b.textContent = t("evExchange"); b.onclick = () => evAct("event_skin", { skin: id }, () => t("evSkinGot", evText(S.name))); }
      cards.push(el("div", { className: "card event" }, art,
        el("div", { className: "name", textContent: evText(S.name) }),
        el("div", { className: "desc", textContent: S.slot === "head" ? t("evSkinHead") : t("evSkinWeapon") }),
        el("div", { className: "ev-have", textContent: t("evPrice", coin, price) }), b));
    }
    // 남은 재화 → 캐시
    const n = Math.max(0, ev.balance || 0);
    const input = el("input", { type: "number", min: 1, max: Math.max(1, n), value: Math.max(1, n), id: "event-cash-n", disabled: !login || !n });
    const cb = el("button", { type: "button", id: "event-cash-btn", disabled: !login || !n });
    const label = () => { cb.textContent = t("evCashBtn", Math.max(1, Math.min(n, Number(input.value) || 1))); };
    input.oninput = label; label();
    cb.onclick = () => {
      const k = Math.floor(Number(input.value));
      if (!(k >= 1 && k <= n)) return evMsg(t("evErr").bad_amount, "bad");
      if (!confirm(t("evCashAsk", k, coin))) return;
      evAct("event_cash", { amount: k }, (r) => t("evCashGot", r.cash));
    };
    cards.push(el("div", { className: "card event" },
      el("div", { className: "art cash-art", textContent: "◆" }),
      el("div", { className: "name", textContent: t("evCash") }),
      el("div", { className: "desc", textContent: t("evCashDesc", coin) }),
      have.cloneNode(true), el("div", { className: "ev-cash-row" }, input, cb)));
    $("event-cards").replaceChildren(...cards);
  }
  async function evAct(route, body, done) {
    if (evBusy) return;
    evBusy = true; evMsg("");
    for (const b of $("event-cards").querySelectorAll("button")) b.disabled = true;
    try {
      const r = await evCall(route, body);
      ev = r; renderEvent(); evMsg(done(r), "good");
    } catch (e) {
      evMsg(e.message, "bad");
      await loadEvent();
    } finally { evBusy = false; }
  }

  // ---- 상품 ----
  let packs = [], boxes = [], offers = [];
  const money = (price) => {
    if (!price) return "";
    try { return new Intl.NumberFormat(lang, { style: "currency", currency: price.currency }).format(Number(price.amount)); }
    catch { return `${price.amount} ${price.currency}`; }
  };

  async function loadCatalog() {
    try {
      // 로그인했으면 내 구매 제한(한정 판매)이 반영된 목록으로. 토큰이 만료됐으면 로그인 없이
      const itemsUrl = `/items/virtual_items?locale=${lang}&limit=50`;
      const [p, v] = await Promise.all([
        api(`/items/virtual_currency/package?locale=${lang}&limit=50`),
        Auth.loggedIn() ? api(itemsUrl, { auth: true }).catch(() => api(itemsUrl)) : api(itemsUrl),
      ]);
      packs = (p.items || []).filter(i => i.groups?.some(g => g.external_id === SHOP.packGroup));
      boxes = (v.items || []).filter(i => i.groups?.some(g => g.external_id === SHOP.boxGroup));
      offers = (v.items || []).filter(i => i.groups?.some(g => g.external_id === SHOP.offerGroup));
      renderOffers();
      renderPacks();
      renderBoxes();
    } catch {
      $("packs").replaceChildren(el("div", { className: "msg bad", textContent: t("errLoad") }));
      $("boxes").replaceChildren();
    }
  }

  const cashIn = (pack) => pack.content?.find(c => c.sku === SHOP.cashSku)?.quantity || 0;
  const bonusOf = (pack) => (pack.promotions || []).flatMap(p => p.bonus || []).filter(b => b.sku === SHOP.cashSku).reduce((s, b) => s + b.quantity, 0);
  const drawsOf = (sku) => Number(/_(\d+)$/.exec(sku)?.[1] || 1);
  const cashPrice = (item) => Number(item.virtual_prices?.find(p => p.sku === SHOP.cashSku)?.amount || 0);

  function renderPacks() {
    $("packs").replaceChildren(...packs.map((pack, i) => {
      const base = cashIn(pack), bonus = bonusOf(pack);
      const btn = el("button", { type: "button", className: "primary" });
      if (Auth.loggedIn()) { btn.textContent = `${money(pack.price)}`; btn.onclick = () => buyPack(pack); }
      else { btn.textContent = t("buyLogin"); btn.onclick = () => (location.href = "./?login=shop"); }
      return el("div", { className: "card", dataset: { sku: pack.sku } },
        bonus ? el("span", { className: "bonus", textContent: t("bonus", bonus, Math.round(bonus / base * 100)) }) : null,
        el("div", { className: "art cash-art", textContent: "◆".repeat(Math.min(4, i + 1)) }),
        el("div", { className: "name", textContent: pack.name }),
        el("div", { className: "total", textContent: t("total", base + bonus) }),
        btn);
    }));
  }

  // 한정 판매: 현금 결제, 계정당 1회 (Xsolla 구매 제한. 다 샀으면 Xsolla가 목록에서 빼거나 available 0)
  const offerLeft = (o) => o.can_be_bought === false ? 0 : (o.limits?.per_user?.available ?? 1);
  function renderOffers() {
    $("offers-sec").hidden = !offers.length;
    $("offers").replaceChildren(...offers.map(o => {
      const left = offerLeft(o);
      const btn = el("button", { type: "button", className: "primary" });
      if (!Auth.loggedIn()) { btn.textContent = t("buyLogin"); btn.onclick = () => (location.href = "./?login=shop"); }
      else if (left <= 0) { btn.textContent = t("offerSold"); btn.disabled = true; }
      else { btn.textContent = money(o.price); btn.onclick = () => buyOffer(o); }
      return el("div", { className: "card offer", dataset: { sku: o.sku } },
        el("span", { className: "bonus", textContent: t("offerLimit") }),
        el("div", { className: "art box-art", textContent: "🎁" }),
        el("div", { className: "name", textContent: o.name }),
        el("div", { className: "desc", textContent: o.description }),
        btn);
    }));
  }

  function renderBoxes() {
    if (!boxes.length) return;
    $("boxes").replaceChildren(...boxes.map(box => {
      const price = cashPrice(box), draws = drawsOf(box.sku);
      const btn = el("button", { type: "button", className: "primary" });
      if (!Auth.loggedIn()) { btn.textContent = t("buyLogin"); btn.onclick = () => (location.href = "./?login=shop"); }
      else {
        const short = balance != null && balance < price;
        btn.textContent = short ? `${t("notEnough")} (◆ ${price})` : `◆ ${price} ${t("buy")}`;
        btn.disabled = short;
        btn.onclick = () => buyBox(box);
      }
      return el("div", { className: "card", dataset: { sku: box.sku } },
        el("div", { className: "art box-art", textContent: draws >= 50 ? "▣▣▣" : draws >= 10 ? "▣▣" : "▣" }),
        el("div", { className: "name", textContent: box.name }),
        el("div", { className: "desc", textContent: box.description }),
        btn);
    }));
  }

  // 확률 공개 (dc#107): 규칙에서 정확히 계산한 값 (RLItems.boxOdds). 위 줄은 요약, 아래 표는 등급·고대·부위·여러 번 상자
  const ODDS_UPDATED = "2026-10-28";   // 확률이 바뀌는 규칙 변경을 하면 같이 바꿈
  const pctText = (p) => (p >= 0.99995 && p < 1 ? ">99.99%" : `${(p * 100).toFixed(p < 0.01 ? 3 : 2)}%`);   // 100%가 아닌데 100.00%로 보이지 않게
  function renderRates() {
    const odds = RLItems.boxOdds();
    const order = ["legendary", "set", "epic", "rare", "uncommon", "common"].filter(r => odds.at[r]);   // 나오는 등급만
    $("rates").replaceChildren(el("span", { textContent: t("rates") }),
      ...order.map(r => el("span", { style: `color:${RLItems.RARITIES[r].color}`, textContent: `${t("rarity")[r]} ${pctText(odds.at[r])}` })));
    const row = (r) => el("tr", {}, el("td", { style: `color:${RLItems.RARITIES[r].color}`, textContent: t("rarity")[r] }),
      el("td", { className: "num", textContent: pctText(odds.at[r]) }), el("td", { className: "num", textContent: odds.ancient[r] != null ? pctText(odds.ancient[r]) : "–" }));
    const draws = [1, 10, 50];
    $("odds").replaceChildren(
      el("h3", { textContent: t("oddsTitle") }),
      el("table", {}, el("thead", {}, el("tr", {}, ...[t("oddsRarity"), t("oddsChance"), t("oddsAncient")].map(h => el("th", { textContent: h })))), el("tbody", {}, ...order.map(row))),
      el("ul", {}, ...[
        t("oddsSlots", pctText(1 / Object.keys(odds.slots).length)),
        t("oddsAncientNote", pctText(odds.ancientChance)),
        t("oddsNone"), t("oddsNoUnique"), t("oddsLevel"),
        t("oddsMulti", draws.map(n => t("oddsTimes", n, pctText(odds.atLeast(n, ["set"])))).join(" · "), draws.map(n => t("oddsTimes", n, pctText(odds.atLeastAncient(n)))).join(" · ")),
        t("oddsUbox"), t("oddsUpdated", ODDS_UPDATED),
      ].map(text => el("li", { textContent: text }))));
  }

  // ---- 장비 상자: 캐시로 구매 → Xsolla 웹훅(order_paid)을 받은 게임 서버가 열어서 게임 우편함으로 ----
  // 결과는 주문 번호를 시드로 정해짐 (box|o주문 번호|순번). 상점은 서버에 결과를 물어서 보여주기만 함
  // 게임 서버가 없을 때(RANKING_API 없음)만 예전처럼 브라우저에서 열어 게임 보관함(rl_mail)으로
  const pendingKey = () => `rl_box_pending:${Auth.owner()}`;
  const mailKey = () => `rl_mail:${Auth.owner()}`;
  // 상자 아이템 레벨 = 일반 던전 최고 층의 레벨 (50층 기준 저장 f50이면 1.5 × 층, 최대 75. dc#98, 서버 market.php box_level과 같게)
  const itemLevel = () => { const s = readJson("rl_save", {}), b = Math.max(1, s?.best || 1); return s?.f50 ? Math.min(75, Math.round(b * 1.5)) : Math.min(75, b); };

  function openBoxes(orderId, sku, draws, lvl) {
    const items = [];
    for (let i = 0; i < draws; i++) items.push(RLItems.generate(`box|o${orderId}|${i}`, "box", lvl));
    const mail = readJson(mailKey(), []);
    for (const item of items) {
      if (!mail.some(m => m.item.id === item.id)) mail.push({ item, from: "box", order: String(orderId), sku, t: new Date().toISOString() });
    }
    store.set(mailKey(), JSON.stringify(mail));
    return items;
  }

  // 열기가 끝난 상자는 Xsolla 인벤토리에서 소모해서, 인벤토리에는 아직 안 연 상자만 남게 한다
  async function consume(sku, quantity) {
    await api("/user/inventory/item/consume", { method: "POST", auth: true, body: { sku, quantity, instance_id: null } });
  }

  async function settlePending() {
    const pending = readJson(pendingKey(), []);
    const left = [];
    for (const p of pending) {
      try { await consume(p.sku, 1); } catch { left.push(p); }
    }
    store.set(pendingKey(), JSON.stringify(left));
    return left;
  }

  // 구매 직후 창이 닫혀서 소모하지 못한 상자를 마저 소모. 게임 서버가 있으면 상자는 서버가 이미 우편함에 넣었으므로 열지 않음
  // (게임 서버가 없을 때만 남은 상자를 브라우저에서 엶)
  async function recoverUnopened() {
    const pending = await settlePending();
    if (window.RANKING_API) return;
    let inv;
    try { inv = await api("/user/inventory/items?limit=50", { auth: true }); } catch { return; }
    let opened = 0;
    const items = [];
    for (const it of inv.items || []) {
      if (!boxes.some(b => b.sku === it.sku) && !/^box_equipment_/.test(it.sku)) continue;
      const waiting = pending.filter(p => p.sku === it.sku).length;  // 이미 열었고 소모만 남은 것
      const extra = (it.quantity || 0) - waiting;
      for (let n = 0; n < extra; n++) {
        const key = `rec${it.instance_id || ""}${Date.now()}x${n}`;
        try { await consume(it.sku, 1); } catch { break; }
        items.push(...openBoxes(key, it.sku, drawsOf(it.sku), itemLevel()));
        opened++;
      }
    }
    if (opened) showReveal(t("recovered", opened), items);
  }

  // 서버가 웹훅을 받아 상자를 열 때까지 잠깐 기다림 (보통 몇 초). 결과 아이템 목록, 시간 안에 안 오면 null (나중에 우편함으로 옴)
  async function serverBox(orderId, waitMs = 20000) {
    const end = Date.now() + waitMs;
    while (Date.now() < end) {
      try {
        const tok = await Auth.token();
        const res = await fetch(`${window.RANKING_API}?r=box_order&order=${encodeURIComponent(orderId)}`, { headers: { Authorization: `Bearer ${tok}` } });
        const d = res.ok ? await res.json() : null;
        if (d?.ready) return d.items.map(r => RLItems.fromRef(r)).filter(Boolean);
      } catch {}
      await new Promise(r => setTimeout(r, 1500));
    }
    return null;
  }

  let busy = false;
  async function buyBox(box) {
    if (busy) return;
    busy = true;
    const draws = drawsOf(box.sku);
    $("box-title").textContent = t("boxTitleN", draws);
    $("box-msg").replaceChildren(el("div", { className: "loader", textContent: t("opening") }));
    $("box-items").replaceChildren();
    $("box-modal").hidden = false;
    try {
      const { order_id } = await api(`/payment/item/${encodeURIComponent(box.sku)}/virtual/${SHOP.cashSku}`, { method: "POST", auth: true, body: {} });
      // 소모가 끝나기 전에 창이 닫혀도 다시 열지 않도록 먼저 기록
      store.set(pendingKey(), JSON.stringify([...readJson(pendingKey(), []), { order: order_id, sku: box.sku }]));
      if (window.RANKING_API) {
        const items = await serverBox(order_id);
        if (items) showReveal(t("boxMail", items.length), items);
        else $("box-msg").replaceChildren(el("div", { className: "msg good", textContent: t("boxLater") }));
      } else {
        const items = openBoxes(order_id, box.sku, draws, itemLevel());
        showReveal(t("boxGot", items.length), items);
      }
      await settlePending();
    } catch (e) {
      $("box-msg").replaceChildren(el("div", { className: "msg bad", textContent: friendly(e) }));
    } finally {
      busy = false;
      refreshBalance();
    }
  }

  function showReveal(text, items) {
    $("box-title").textContent ||= t("boxTitle");
    $("box-msg").replaceChildren(el("div", { className: "msg good", textContent: text }));
    const order = ["legendary", "set", "epic", "rare", "uncommon", "common"];
    const sorted = [...items].sort((a, b) => (b.ancient ? 1 : 0) - (a.ancient ? 1 : 0) || order.indexOf(a.rarity) - order.indexOf(b.rarity));   // 고대 먼저
    $("box-items").replaceChildren(...sorted.map((item, i) => el("div", { style: `animation-delay:${Math.min(i, 30) * 60}ms` },
      el("span", { textContent: RLItems.itemName(item), style: `color:${RLItems.RARITIES[item.rarity].color}` }),
      el("small", { textContent: `${t("rarity")[item.rarity]}${item.ancient ? " · " + t("ancient") : ""} · ${t("lvl", item.lvl)}` }))));
    $("box-modal").hidden = false;
  }
  $("box-close").onclick = () => { $("box-modal").hidden = true; $("box-title").textContent = ""; };

  // ---- 캐시 충전: 주문 생성 → Headless Checkout ----
  const sdk = window.PayStationSdk?.headlessCheckout;
  let sdkLang = null;            // init 때의 언어 (바뀌면 다시 초기화)
  let current = null;            // { pack, orderId, token, method }
  let unsubscribe = null;
  let statusShown = false;
  let fieldsAbort = null;

  // 카드 입력칸은 Xsolla iframe 안에 있어서 바깥 CSS가 닿지 않음 → 따로 전달
  const SECURE_CSS = `
    input { background: #0d0e14; color: #cdd3de; font-family: "Courier New", monospace; font-size: 16px;
            border: 0; outline: 0; width: 100%; height: 100%; padding: 0 10px; box-sizing: border-box; }
    input::placeholder { color: #5d6474; }
  `;

  async function ensureSdk() {
    if (!sdk) throw new Error("Payment SDK not loaded");
    if (sdkLang === lang) return;
    if (sdkLang) {
      // 언어가 바뀌면 다시 초기화. 이전 구독은 먼저 해제해서 두 번 받지 않게
      unsubscribe?.();
      unsubscribe = null;
      sdk.destroy();
    }
    await sdk.init({ sandbox: SHOP.sandbox, isWebView: false, language: lang });
    await sdk.setSecureComponentStyles(SECURE_CSS);
    sdkLang = lang;
  }

  function payMsg(text, cls = "info") {
    $("pay-msg").replaceChildren(...(text ? [el("div", { className: `msg ${cls}`, textContent: text })] : []));
  }
  function resetPayView() {
    payMsg("");
    $("pay-methods").replaceChildren();
    $("pay-fields").replaceChildren();
    $("pay-submit").replaceChildren();
    $("pay-extra").replaceChildren();
    $("pay-form").hidden = true;
  }

  function openPayModal(title) {
    $("pay-what").textContent = title;
    resetPayView();
    $("pay-status").replaceChildren();
    statusShown = false;
    $("pay-modal").hidden = false;
  }
  function closePayModal() {
    $("pay-modal").hidden = true;
    stopOrderWatch();
    fieldsAbort?.abort();
    current = null;
    // SDK는 그대로 두고 다음 구매 때 새 토큰(setToken)으로 다시 시작
    // 돌아온 주소의 결제 파라미터 정리
    if (location.search) history.replaceState(null, "", location.pathname);
    refreshBalance();
  }
  $("pay-close").onclick = closePayModal;

  async function buyPack(pack) {
    if (busy) return;
    busy = true;
    openPayModal(`${pack.name} · ${t("total", cashIn(pack) + bonusOf(pack))}`);
    payMsg(t("creating"));
    try {
      const order = await api(`/payment/item/${encodeURIComponent(pack.sku)}`, {
        method: "POST", auth: true,
        body: { sandbox: SHOP.sandbox, locale: lang, quantity: 1 },
      });
      current = { pack, orderId: order.order_id, token: order.token };
      await ensureSdk();
      await sdk.setToken(order.token);
      subscribeOnce();
      await showMethods();
    } catch (e) {
      payMsg(e instanceof ApiError ? friendly(e) : t("errGeneric", e.message), "bad");
    } finally {
      busy = false;
    }
  }

  // 한정 판매 결제: 캐시 충전과 같은 결제 창. 주문 종류를 기억해 둠 (결제 사이트에서 돌아와도 무엇을 샀는지 알게)
  const offerOrderKey = (id) => `rl_offer_order:${id}`;
  async function buyOffer(offer) {
    if (busy) return;
    busy = true;
    openPayModal(offer.name);
    payMsg(t("creating"));
    try {
      const order = await api(`/payment/item/${encodeURIComponent(offer.sku)}`, {
        method: "POST", auth: true,
        body: { sandbox: SHOP.sandbox, locale: lang, quantity: 1 },
      });
      current = { offer, orderId: order.order_id, token: order.token };
      store.set(offerOrderKey(order.order_id), offer.sku);
      await ensureSdk();
      await sdk.setToken(order.token);
      subscribeOnce();
      await showMethods();
    } catch (e) {
      payMsg(e instanceof ApiError ? friendly(e) : t("errGeneric", e.message), "bad");
    } finally {
      busy = false;
    }
  }
  // 결제가 끝난 상자를 게임 서버가 Xsolla 인벤토리에서 꺼내 우편함으로 (실패해도 게임 우편함을 열 때 다시 함)
  async function collectOffer() {
    if (!window.RANKING_API) return;
    try {
      const tok = await Auth.token();
      if (tok) await fetch(`${window.RANKING_API}?r=ubox_collect`, { method: "POST", headers: { Authorization: `Bearer ${tok}`, "Content-Type": "application/json" }, body: "{}" });
    } catch {}
  }

  const ICON_BASE = "https://cdn.xsolla.net/headless-checkout-prod/assets/icons";
  function methodIcon(m) {
    const img = el("img", { alt: "", src: m.iconName ? `${ICON_BASE}/brand-logos/${m.iconName}` : `${ICON_BASE}/default-payment-icons/default.svg` });
    img.onerror = () => { if (!img.dataset.fallback) { img.dataset.fallback = 1; img.src = `${ICON_BASE}/default-payment-icons/default.svg`; } else img.remove(); };
    return img;
  }

  // 결제 수단: 나라별 순위(rank)대로 상위 몇 개만 먼저, 나머지는 "더 보기"와 검색으로
  const TOP_METHODS = 6;
  async function showMethods() {
    resetPayView();
    $("pay-methods").append(el("div", { className: "loader", textContent: t("loading") }));
    let methods = [];
    try { methods = await sdk.getRegularMethods({}); } catch {}
    methods = [...methods].sort((a, b) => (a.rank ?? 999) - (b.rank ?? 999));
    const list = el("div", { className: "methods" });
    const button = (m) => el("button", { type: "button", className: "method", onclick: () => selectMethod(m) }, methodIcon(m), el("span", { textContent: m.name }));
    const draw = (items) => list.replaceChildren(...(items.length ? items.map(button) : [el("div", { className: "msg info", textContent: t("noMatch") })]));
    draw(methods.slice(0, TOP_METHODS));
    const parts = [el("div", { className: "step-title", textContent: t("chooseMethod") })];
    if (!methods.length) parts.push(el("div", { className: "msg info", textContent: t("noMethods") }));
    else {
      parts.push(list);
      if (methods.length > TOP_METHODS) {
        const search = el("input", { type: "search", className: "method-search", placeholder: t("searchMethods"), hidden: true });
        search.addEventListener("input", () => {
          const q = search.value.trim().toLowerCase();
          draw(q ? methods.filter(m => `${m.name},${m.aliases || ""}`.toLowerCase().includes(q)) : methods);
        });
        const more = el("button", { type: "button", className: "more-methods", textContent: t("moreMethods", methods.length - TOP_METHODS), onclick: () => {
          more.remove(); search.hidden = false; draw(methods); search.focus();
        } });
        parts.splice(1, 0, search);
        parts.push(more);
      }
    }
    $("pay-methods").replaceChildren(...parts);
  }

  function returnUrl() {
    const u = new URL(location.href.split("#")[0]);
    u.search = "";
    u.searchParams.set("paid", String(current.orderId));
    u.searchParams.set("token", current.token);
    return u.toString();
  }

  async function selectMethod(m) {
    current.method = m;
    resetPayView();
    $("pay-form").hidden = false;
    $("pay-method-name").textContent = m.name;
    $("pay-fields").replaceChildren(el("div", { className: "loader", textContent: t("loading") }));
    try {
      const form = await sdk.form.init({
        paymentMethodId: m.id,
        returnUrl: returnUrl(),
        paymentMethodSettings: { useSingleExpirationDateField: true },
      });
      await renderFields(form.fields, form.submitButtonText);
      if (form.isFormAutoSubmitted) $("pay-submit").replaceChildren();
    } catch (e) {
      payMsg(t("errGeneric", e.message || e), "bad");
    }
  }

  // 서버가 보내 주는 입력칸을 그대로 그림 (label은 입력칸이 아니라 건너뜀)
  async function renderFields(fields, submitText) {
    fieldsAbort?.abort();
    fieldsAbort = new AbortController();
    const box = $("pay-fields");
    box.replaceChildren(el("div", { className: "loader", textContent: t("loading") }));
    const holder = el("div", { className: "fields", hidden: true });
    const mounted = [];
    const rank = (f) => f.name === "card_number" ? 0 : /exp/i.test(f.name) ? 1 : /cvv|cvc/i.test(f.name) ? 2 : f.type === "check" ? 9 : 5;
    for (const f of [...(fields || [])].sort((a, b) => rank(a) - rank(b))) {
      let node;
      if (f.name === "card_number") node = el("psdk-card-number");
      else if (f.name === "phone") node = el("psdk-phone");
      else if (f.type === "text") node = el("psdk-text");
      else if (f.type === "select") node = el("psdk-select");
      else if (f.type === "check") node = el("psdk-checkbox");
      else continue;
      node.setAttribute("name", f.name);
      if (f.name === "card_number") node.setAttribute("icon", "true");
      if (f.name === "phone") node.setAttribute("showFlags", "true");
      if (/exp|cvv|cvc|year|month/i.test(f.name)) node.classList.add("half");
      holder.append(node);
      if (f.type !== "check") mounted.push(f);
    }
    box.append(holder);
    const submit = el("psdk-submit-button");
    if (submitText) submit.setAttribute("text", submitText);
    $("pay-submit").replaceChildren(submit);
    try {
      await sdk.form.setupAndAwaitFieldsLoading(mounted, fieldsAbort.signal);
    } catch { return; }  // 다른 단계로 넘어가며 취소됨
    box.querySelector(".loader")?.remove();
    holder.hidden = false;
    sdk.form.activate();
  }

  function subscribeOnce() {
    if (unsubscribe) return;
    unsubscribe = sdk.form.onNextAction(onNextAction);
  }

  // 결제 단계는 서버가 정함: 오는 대로 처리하고, 결제 수단별로 분기하지 않음
  function onNextAction(action) {
    switch (action.type) {
      case "show_fields":
        renderFields(action.data?.fields, action.data?.submitButtonText);
        break;
      case "show_errors": {
        const err = action.data?.errors?.[0]?.message;
        if (err) payMsg(err, "bad");
        break;
      }
      case "redirect":
        handleRedirect(action.data.redirect);
        break;
      case "3DS": {
        $("pay-form").hidden = true;
        const three = el("psdk-3ds");
        three.setAttribute("data-challenge", JSON.stringify(action.data.data));
        three.addEventListener("threeDsWindowClosed", () => current?.method && selectMethod(current.method));
        $("pay-extra").replaceChildren(three);
        break;
      }
      case "check_status":
        showStatus();
        break;
      case "status_updated":
        if (action.data?.isSuccess) watchOrder();
        else if (action.data?.isCanceled || action.data?.statusState === "error") payMsg(t("payFailed"), "bad");
        break;
      case "special_button":
      case "show_qr_code":
      case "show_mobile_payment_screen":
      case "show_cash_payment_instruction":
        // 아직 이 화면들은 만들지 않음 (샌드박스에서는 카드·PayPal 등 리다이렉트 결제로 시험)
        payMsg(t("unsupported"), "bad");
        break;
      default:
        break;
    }
  }

  // 결제 사이트(PayPal·은행·3DS 등)는 새 창으로 연다 (결제창이 통째로 다른 페이지로 넘어가지 않게, dc#55)
  //   새 창은 사용자 클릭 안에서만 열 수 있어서 "결제 창 열기" 버튼을 보여 줌. 이 창은 그대로 두고 주문 상태를 확인
  //   서버가 같은 창을 요구해도(isSameWindowRequired: 카드 확인 페이지도 이걸 보냄) 새 창으로 엶. 팝업이 막히면 이 창에서 이동
  //   (Venmo·Alipay 같은 앱 연동 결제 수단은 새 창에서 안 될 수 있음 → 그런 수단이 생기면 여기서 예외로)
  const PAY_WINDOW = "rl_pay_window";
  let payWindow = null, payWindowTimer = null;
  function handleRedirect(redirect) {
    $("pay-form").hidden = true;
    const { redirectUrl, data = {}, method } = redirect;
    const form = el("form", { method: String(method || "GET").toUpperCase() === "POST" ? "POST" : "GET", action: redirectUrl });
    for (const [name, value] of Object.entries(data)) form.append(el("input", { type: "hidden", name, value: String(value) }));
    document.body.append(form);
    form.target = PAY_WINDOW;
    // 새 창이 닫히기 전에 결과를 받을 수 있게 상태 확인을 한 번 시작 (그 뒤로는 status_updated + 주문 확인)
    sdk.getStatus?.().catch?.(() => {});
    watchOrder();
    const open = () => {
      window.rlPayOrder = String(current?.orderId || "");   // 돌아온 결제 창이 "내 주문"인지 확인하는 표시
      payWindow = window.open("about:blank", PAY_WINDOW);
      if (!payWindow) { form.target = ""; payMsg(t("waiting")); form.submit(); return; }   // 팝업 차단: 이 창에서
      form.submit();
      payMsg(t("payWindowHint"));
      clearInterval(payWindowTimer);
      payWindowTimer = setInterval(() => {
        if (!payWindow || !payWindow.closed) return;
        clearInterval(payWindowTimer);
        if (watchTimer) payMsg(t("payWindowClosed"));
      }, 1000);
    };
    payMsg(t("payWindowHint"));
    $("pay-extra").replaceChildren(el("button", { type: "button", className: "primary pay-window-btn", textContent: t("openPayWindow"), style: "width:100%", onclick: open }));
  }
  // 새 창에서 결제 사이트가 returnUrl(이 페이지)로 돌아오면: 원래 창에 알리고 이 창은 닫음
  window.addEventListener("message", (e) => {
    if (e.origin !== location.origin || e.data?.type !== "rl-pay-return") return;
    clearInterval(payWindowTimer);
    try { payWindow?.close(); } catch {}
    payWindow = null;
    $("pay-extra").replaceChildren();
    if (current && String(current.orderId) === String(e.data.orderId)) { payMsg(t("waiting")); watchOrder(); }
  });

  // psdk-status는 결제가 있을 때만 만든다 (미리 두면 시작하자마자 상태 조회에 실패함)
  function showStatus() {
    if (statusShown) return;
    statusShown = true;
    $("pay-methods").replaceChildren();
    $("pay-form").hidden = true;
    $("pay-extra").replaceChildren();
    payMsg("");
    $("pay-status").replaceChildren(el("psdk-status"));
    watchOrder();
  }

  // 주문이 done이 되면 캐시가 들어온 것 (3초마다, 최대 10분)
  let watchTimer = null;
  function watchOrder() {
    if (watchTimer || !current?.orderId) return;
    const started = Date.now();
    const tick = async () => {
      try {
        const o = await api(`/order/${current.orderId}`, { auth: true });
        if (o.status === "done") {
          stopOrderWatch();
          try { payWindow?.close(); } catch {}
          $("pay-extra").replaceChildren();
          if (current.offer || store.get(offerOrderKey(current.orderId))) {
            store.del(offerOrderKey(current.orderId));
            await collectOffer();
            payMsg(t("offerPaid"), "good");
            loadCatalog();   // 구매 제한 반영 (구매 완료)
            return;
          }
          const amount = current.pack ? cashIn(current.pack) + bonusOf(current.pack) : 0;
          payMsg(amount ? t("paid", amount) : t("paidNoAmount"), "good");
          refreshBalance();
          return;
        }
        if (o.status === "canceled" || o.status === "expired") { stopOrderWatch(); payMsg(t("payFailed"), "bad"); return; }
      } catch {}
      if (Date.now() - started < 600000) watchTimer = setTimeout(tick, 3000);
      else stopOrderWatch();
    };
    watchTimer = setTimeout(tick, 1000);
  }
  function stopOrderWatch() { clearTimeout(watchTimer); watchTimer = null; clearInterval(payWindowTimer); }

  // 결제 사이트(3DS, PayPal 등)에서 돌아왔을 때: 같은 토큰으로 상태만 보여줌 (form.init 하지 않음)
  async function handleReturn() {
    const q = new URLSearchParams(location.search);
    const token = q.get("token"), orderId = q.get("paid");
    if (!token || !orderId) return false;
    // 새 창(결제 창)으로 돌아온 경우: 원래 창이 확인하니 알리고 닫음
    let opener = null;
    try { opener = window.opener && window.opener.location.origin === location.origin && window.opener.rlPayOrder === orderId ? window.opener : null; } catch {}
    if (opener) {   // window.name은 결제 사이트를 거치며 지워질 수 있어서 원래 창의 주문 번호로 확인
      opener.postMessage({ type: "rl-pay-return", orderId, search: location.search }, location.origin);
      showPageMsg(t("payWindowReturned"), "good");
      setTimeout(() => window.close(), 300);
      return true;
    }
    openPayModal(t("payTitle"));
    current = { orderId, token, pack: null };
    try {
      await ensureSdk();
      await sdk.setToken(token);
      subscribeOnce();
      showStatus();
    } catch (e) {
      payMsg(t("errGeneric", e.message || e), "bad");
    }
    return true;
  }

  $("pay-back").onclick = () => { fieldsAbort?.abort(); showMethods(); };

  // ---- 시작 ----
  $("lang").addEventListener("change", () => {
    lang = $("lang").value;
    store.set("rl_lang", lang);
    applyText();
    loadCatalog();
    renderEvent();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!$("box-modal").hidden) $("box-close").click();
  });

  applyText();
  (async () => {
    // 이벤트 칸 (dc#130): 게임 마을의 이벤트 배너에서 오면(#event) 그 칸으로
    await loadEvent();
    if (location.hash === "#event" && !$("event-sec").hidden) $("event-sec").scrollIntoView();
    await loadCatalog();
    await refreshBalance();
    const returned = await handleReturn();
    if (Auth.loggedIn() && !returned) recoverUnopened();
  })();
})();
</script>
</body>
</html>
